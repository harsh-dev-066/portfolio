<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090e" />

    <title>Harsh Thakur — Senior Software Engineer</title>
    <meta
      name="description"
      content="Harsh Thakur is a Senior Software Engineer in Bengaluru with ~5 years of experience building scalable SaaS, logistics and warehouse platforms with React, TypeScript, Python and AWS."
    />
    <meta name="author" content="Harsh Thakur" />
    <meta
      name="keywords"
      content="Harsh Thakur, Senior Software Engineer, Frontend Engineer, React, Next.js, TypeScript, AWS, Bengaluru, Portfolio"
    />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Harsh Thakur — Senior Software Engineer" />
    <meta
      property="og:description"
      content="Building scalable SaaS and logistics platforms. React, TypeScript, Python, AWS and AI-assisted engineering."
    />
    <meta property="og:image" content="%PUBLIC_URL%/portfolio.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Harsh Thakur — Senior Software Engineer" />
    <meta
      name="twitter:description"
      content="Building scalable SaaS and logistics platforms. React, TypeScript, Python, AWS and AI-assisted engineering."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/portfolio.png" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
    />

    <!-- Apply the saved theme before first paint so there is no flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("portfolio-theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
